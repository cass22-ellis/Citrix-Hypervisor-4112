name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up environment
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Ref:        ${{ github.ref }}"

      - name: Verify build
        run: echo "✓ build passed"
